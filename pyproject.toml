[project]
name = "llm-abstraction"
version = "0.1.0"
description = "Provider-agnostic LLM abstraction layer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Affaan Mustafa", email = "affaan@example.com"}
]
keywords = ["llm", "openai", "anthropic", "ollama", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "anthropic>=0.120.2",
    "openai>=2.34.0",
]

[dependency-groups]
# `uv sync` installs this group by default; `pip install --group dev` (pip 25.1+).
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/affaan-m/ECC"
Repository = "https://github.com/affaan-m/ECC"

[project.scripts]
llm-select = "llm.cli.selector:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package is `llm`, not the distribution name `llm_abstraction`.
module-name = "llm"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/llm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
src = ["src"]
# Scope ruff to this Python package. Skill scripts and integrations have their
# own styles and are checked where they live.
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: line length is handled by the formatter, not enforced here.
# UP042: the (str, Enum) mixin is intentional — enum members must compare
#        and serialize as plain strings across providers. StrEnum changes
#        str() semantics, so the explicit mixin is kept deliberately.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_ignores = true
