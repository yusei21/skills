name: skill-index

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "scripts/build-skill-index.js"
      - ".skill-index/skills.json"
      - ".github/workflows/skill-index.yml"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "scripts/build-skill-index.js"
      - ".skill-index/skills.json"
      - ".github/workflows/skill-index.yml"

permissions:
  contents: write

jobs:
  skill-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate skill index
        run: node scripts/build-skill-index.js

      - name: Verify pull request index
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- .skill-index/skills.json

      - name: Commit regenerated index on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- .skill-index/skills.json; then
            echo "Skill index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .skill-index/skills.json
          git commit -m "chore: regenerate skill index"
          git push
